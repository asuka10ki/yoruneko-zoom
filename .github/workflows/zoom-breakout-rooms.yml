name: Zoom Breakout Rooms

on:
  schedule:
    # 18:00 JST = 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target date (YYYY-MM-DD). Empty means today in Asia/Tokyo."
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update-breakout-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEET_NAME: ${{ vars.SHEET_NAME || 'ルーム管理' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tokyo' }}
      ZOOM_UPDATE_ENABLED: ${{ vars.ZOOM_UPDATE_ENABLED || 'true' }}
      ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
      ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
      ZOOM_REFRESH_TOKEN: ${{ secrets.ZOOM_REFRESH_TOKEN }}
      ZOOM_MEETING_ID: ${{ secrets.ZOOM_MEETING_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_NOTIFY_ON_SUCCESS: ${{ vars.SLACK_NOTIFY_ON_SUCCESS || 'true' }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run batch
        id: run_batch
        continue-on-error: true
        run: npm start

      - name: Update dashboard history
        if: always()
        run: |
          node scripts/update-dashboard-history.mjs \
            "${{ github.event_name }}" \
            "${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}" \
            "${{ steps.run_batch.outcome }}" \
            "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit dashboard history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/runs.json
          git diff --cached --quiet || git commit -m "Update dashboard history"
          git push

      - name: Update issue dashboard
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-issue-dashboard.mjs

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4

      - name: Upload logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-breakout-rooms-result
          path: |
            logs/
            output/result.json
            output/zoom-breakout-rooms.csv
          if-no-files-found: ignore

      - name: Fail workflow when batch failed
        if: steps.run_batch.outcome != 'success'
        run: exit 1
