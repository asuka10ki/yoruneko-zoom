name: Zoom Breakout Rooms

on:
  schedule:
    # Retry windows for 18:05, 18:15, and 18:30 JST.
    # The job skips later windows when the target date already has a successful run.
    - cron: "5 9 * * *"
    - cron: "15 9 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target date (YYYY-MM-DD). Empty means today in Asia/Tokyo."
        required: false
        type: string
      trigger_source:
        description: "Optional trigger source label."
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: zoom-breakout-rooms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-breakout-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEET_NAME: ${{ vars.SHEET_NAME || 'ルーム管理' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Tokyo' }}
      ZOOM_UPDATE_ENABLED: ${{ vars.ZOOM_UPDATE_ENABLED || 'true' }}
      ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
      ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
      ZOOM_REFRESH_TOKEN: ${{ secrets.ZOOM_REFRESH_TOKEN }}
      ZOOM_MEETING_ID: ${{ secrets.ZOOM_MEETING_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_NOTIFY_ON_SUCCESS: ${{ vars.SLACK_NOTIFY_ON_SUCCESS || 'true' }}
      GH_PAT: ${{ secrets.GH_PAT }}
      HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
      HEARTBEAT_SECRET: ${{ secrets.HEARTBEAT_SECRET }}
      TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github_schedule' || github.event.inputs.trigger_source || 'manual' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to run
        id: run_decision
        run: node scripts/decide-scheduled-run.mjs "${{ github.event_name }}" "${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}" "${TRIGGER_SOURCE}"

      - name: Set target date
        run: echo "TARGET_DATE=${{ steps.run_decision.outputs.target_date }}" >> "$GITHUB_ENV"

      - name: Show trigger source
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "trigger_source=${TRIGGER_SOURCE}"
          echo "target_date=${{ steps.run_decision.outputs.target_date }}"
          echo "should_run=${{ steps.run_decision.outputs.should_run }}"
          echo "zoom_refresh_token_present=${{ secrets.ZOOM_REFRESH_TOKEN != '' }}"

      - name: Setup Node.js
        if: steps.run_decision.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.run_decision.outputs.should_run == 'true'
        run: npm ci

      - name: Build
        if: steps.run_decision.outputs.should_run == 'true'
        run: npm run build

      - name: Run batch
        if: steps.run_decision.outputs.should_run == 'true'
        id: run_batch
        continue-on-error: true
        run: npm start

      - name: Update dashboard history
        if: always() && steps.run_decision.outputs.should_run == 'true'
        run: |
          node scripts/update-dashboard-history.mjs \
            "${TRIGGER_SOURCE}" \
            "${{ steps.run_decision.outputs.target_date }}" \
            "${{ steps.run_batch.outcome }}" \
            "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send heartbeat
        if: always() && steps.run_decision.outputs.should_run == 'true'
        run: |
          node scripts/send-heartbeat.mjs \
            "${{ github.event_name }}" \
            "${TRIGGER_SOURCE}" \
            "${{ steps.run_decision.outputs.target_date }}" \
            "${{ steps.run_batch.outcome }}" \
            "${{ github.run_id }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit dashboard history
        if: always() && steps.run_decision.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/runs.json
          git diff --cached --quiet || git commit -m "Update dashboard history"
          git push

      - name: Update issue dashboard
        if: always() && steps.run_decision.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-issue-dashboard.mjs

      - name: Configure Pages
        if: always() && steps.run_decision.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: always() && steps.run_decision.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard to GitHub Pages
        if: always() && steps.run_decision.outputs.should_run == 'true'
        uses: actions/deploy-pages@v4

      - name: Upload logs and outputs
        if: always() && steps.run_decision.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zoom-breakout-rooms-result
          path: |
            logs/
            output/result.json
            output/zoom-breakout-rooms.csv
          if-no-files-found: ignore

      - name: Fail workflow when batch failed
        if: steps.run_decision.outputs.should_run == 'true' && steps.run_batch.outcome != 'success'
        run: exit 1
