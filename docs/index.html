<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoomブレイクアウトルーム設定</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="header">
        <div>
          <p class="eyebrow">夜の猫町プラス</p>
          <h1>Zoomブレイクアウトルーム設定</h1>
        </div>
        <a class="secondary-link" href="https://github.com/asuka10ki/yoruneko-zoom/actions/workflows/zoom-breakout-rooms.yml" target="_blank" rel="noreferrer">GitHub Actions</a>
      </section>

      <section class="panel controls-panel">
        <div class="field-row">
          <label for="targetDate">対象日</label>
          <input id="targetDate" type="date" />
          <button id="todayButton" type="button">今日</button>
        </div>

        <div class="button-row">
          <button id="openActionsButton" type="button" class="primary-button">GitHub画面で実行</button>
          <button id="directRunButton" type="button">この画面から実行</button>
        </div>

        <details class="token-box">
          <summary>この画面から実行するためのGitHub token</summary>
          <p>tokenはブラウザ内の一時保存だけに使い、リポジトリには送信しません。Actionsを実行できる権限を持つtokenが必要です。</p>
          <div class="field-row">
            <label for="githubToken">GitHub token</label>
            <input id="githubToken" type="password" autocomplete="off" placeholder="github_pat_..." />
            <button id="saveTokenButton" type="button">一時保存</button>
          </div>
        </details>

        <p id="message" class="message" role="status"></p>
      </section>

      <section class="panel">
        <div class="section-heading">
          <h2>実行結果</h2>
          <button id="refreshButton" type="button">更新</button>
        </div>
        <div id="summary" class="summary-grid"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>実行時刻</th>
                <th>種別</th>
                <th>日付</th>
                <th>結果</th>
                <th>ルーム数</th>
                <th>詳細</th>
              </tr>
            </thead>
            <tbody id="runsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
